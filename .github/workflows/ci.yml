name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

env:
  ORCHESTRATOR_SHARD_COUNT: 4
  SUITE_COMMAND: bun run check:suite --

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan secrets
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --exit-code 1 --verbose

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install
        run: bun install --silent
      - name: Static checks
        run: bun run check --omit=machine-only --omit=secrets

  orchestrator:
    name: orchestrator (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --silent
      - name: Test shard
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=orchestrator --shard=${{ matrix.shard }}/${ORCHESTRATOR_SHARD_COUNT}

  orchestrator-future-clock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --silent
      - name: Test under the future clock
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=orchestrator/future-clock

  orchestrator-hooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: bun install --silent
      - name: Test
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=orchestrator/hooks

  orchestrator-hooks-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: bun install --silent
      - name: Test
        env:
          CI: "1"
        run: python3 -m unittest discover -s orchestrator/hooks -p 'process_*.py'

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --silent
      - name: Test
        env:
          CI: "1"
          BOTTEGA_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bun run --cwd orchestrator test:postgres --without-live-import

  cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --silent
      - name: Typecheck
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=cli

  hub:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --silent
      - name: Test
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=hub

  hub-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --silent
      - name: Test
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=hub/data

  hub-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --silent
      - name: Test and build
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=hub/web

  hub-web-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Trust the workspace
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Bun
        run: npm install --global "bun@$(cat .bun-version)"
      - name: Install
        run: bun install --silent
      - name: Build
        run: bun run --cwd hub/web build
      - name: Smoke
        run: bun run --cwd hub/web smoke

  hub-ui-stories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Trust the workspace
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Bun
        run: npm install --global "bun@$(cat .bun-version)"
      - name: Install
        run: bun install --silent
      - name: Build stories
        run: bun run --cwd hub/ui storybook:build
      - name: Build view stories
        run: bun run --cwd hub/views storybook:build
      - name: Test stories
        run: bun run --cwd hub/ui storybook:test
      - name: Test view stories
        run: bun run --cwd hub/views storybook:test

  hub-deploy-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --silent
      - name: Test
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=hub/deploy/site

  retrieval:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --silent
      - name: Test
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=retrieval

  shared:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --silent
      - name: Test
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=shared

  root:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --silent
      - name: Test root batch
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=root

  record-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          bun-version-file: .bun-version
      - name: Require a rehearsal for record migration changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/check-record-rehearsal.ts
      - name: Pass outside the merge guard
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: "echo 'record rehearsal: no merge guard event'"

  release-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
        with:
          bun-version-file: .bun-version
      - name: Install
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
        run: bun install
      - name: Allow unprivileged user namespaces for the sandbox
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run release smoke
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
        run: bun scripts/smoke-release.ts
      - name: Prove release runtime config stays inert
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
        env:
          BOTTEGA_RELEASE_REQUIRE_PINNED_BUN: '1'
        run: bun run orch -- release check "v$(jq -r .version package.json)"
      - name: Pass outside the release smoke events
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.event_name != 'workflow_dispatch'
        run: "echo 'release smoke: no pull request, merge queue or dispatch event'"

  checkout-cli-confinement:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --silent
      - name: Allow unprivileged user namespaces for the sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Prove confined checkout ask-server tools
        run: bun run --cwd orchestrator check:checkout-cli-confinement
      - name: Prove source-launch mutation fails
        run: bun run --cwd orchestrator check:checkout-cli-confinement -- --force-source

  migration-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      install-proof: ${{ steps.install-proof.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Find pull request change base
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          base=$(bun scripts/pull-request-change-base.ts)
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
      - name: Find migration changes
        id: changes
        run: |
          changed=false
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            if ! git diff --quiet "$BASE_SHA" HEAD -- orchestrator/migrations hub/migrations hub/src/migrations.ts shared/migration-source.ts ':(glob)orchestrator/src/database/*migration*.ts'; then
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Find release install proof changes
        id: install-proof
        run: |
          changed=false
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            if ! git diff --quiet "$BASE_SHA" HEAD -- install.sh scripts/smoke-release-install.ts scripts/build-binary.ts scripts/build-release-artifacts.ts scripts/release-config.ts orchestrator/hooks/ orchestrator/src/setup/ orchestrator/src/settings/ orchestrator/src/canon/ orchestrator/src/health/ orchestrator/src/mcp/mcp-board-tools.ts hub/src/doctor.ts orchestrator/migrations hub/migrations shared/attribution-markers.json shared/embedded-assets.ts shared/heartbeat-guidance.ts shared/launch-agent-liveness.ts shared/launchd-owners.ts shared/install-root.ts shared/runtime-assets.ts shared/secret-shaped-rules.json shared/self-spawn.ts shared/shell-quote.ts shared/store-write-lock.c shared/store-write-lock.ts orchestrator/src/record/record-session.ts; then
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  migration-compatibility:
    needs: migration-paths
    if: needs.migration-paths.outputs.changed == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --silent
      - name: Print SQLite version
        run: bun -e "import { Database } from 'bun:sqlite'; const db = new Database(':memory:'); console.log(db.query('select sqlite_version() version').get().version)"
      - name: Migrate fresh stores
        env:
          BOTTEGA_STATE_HOME: ${{ runner.temp }}/bottega-migration-compatibility
        run: ./bin/bottega machine migrate

  install-proof:
    needs: migration-paths
    if: needs.migration-paths.outputs.install-proof == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --frozen-lockfile
      - name: Prove the release installs
        run: bun run release:install-proof -- "v$(jq -r .version package.json)"

  ci:
    if: always()
    needs: [secrets, static, cli, orchestrator, orchestrator-future-clock, orchestrator-hooks, orchestrator-hooks-process, postgres, hub, hub-data, hub-ui-stories, hub-web, hub-web-smoke, hub-deploy-site, retrieval, shared, root, record-rehearsal, release-smoke, checkout-cli-confinement, migration-paths, migration-compatibility, install-proof]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(to_entries[]; .value.result == "success" or ((.key == "migration-compatibility" or .key == "install-proof") and .value.result == "skipped"))' <<<"$RESULTS"
