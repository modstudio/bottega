# Calibration run for DEV-450. This deliberately does NOT gate anything yet:
# it exists to find out which of the suite's host-dependent tests behave
# differently on a hosted Linux runner than on the operator's macOS machine.
# Read its result against a local run before wiring any check to it.
name: ci

# MANUAL ONLY, deliberately. The suite is not fit to run here yet: 1,711 tests,
# 874s serial, 84% of it in CLI subprocess tests. Running it on every push buys
# a slow, flaky signal at the cost of the whole free-minute budget.
#
# Automatic triggers go back on when the suite is right-sized under DEV-450.
# The path filters that belong here are kept below, commented, so restoring
# them is one edit rather than a rewrite.
#
# on:
#   pull_request:
#     paths: ['**.ts', '**.tsx', '**/package.json', 'bun.lock',
#             '**/bunfig.toml', '**/tsconfig.json', 'scripts/**',
#             'orchestrator/test/**', '.githooks/**', '.github/workflows/ci.yml']
#   push:
#     branches: [main]
#     paths: [ ...same... ]
on:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The suite creates real git worktrees, commits and ref transactions.
      # Without an identity those operations fail for a reason that has nothing
      # to do with the code under test.
      - name: Give git an identity
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name  ci
          git config --global init.defaultBranch main

      - name: Install
        run: |
          bun install --silent
          (cd orchestrator && bun install --silent)
          (cd hub && bun install --silent)
          (cd hub/web && bun install --silent)

      - name: Typecheck
        run: |
          (cd orchestrator && bun run typecheck)
          (cd hub && bun run typecheck)
          (cd hub/web && bun run typecheck)

      # Reported per package so a Linux-specific failure is attributable to one
      # suite rather than to "the gate". continue-on-error because this run is
      # calibration: we want the whole picture, not the first failure.
      - name: orchestrator suite
        id: orch
        continue-on-error: true
        run: cd orchestrator && bun run test:gate

      - name: hub suite
        id: hub
        continue-on-error: true
        run: cd hub && bun run test

      - name: hub/web suite
        id: web
        continue-on-error: true
        run: cd hub/web && bun run test && bun run build

      - name: Calibration summary
        run: |
          {
            echo "| suite | result |"
            echo "|---|---|"
            echo "| orchestrator | ${{ steps.orch.outcome }} |"
            echo "| hub | ${{ steps.hub.outcome }} |"
            echo "| hub/web | ${{ steps.web.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
