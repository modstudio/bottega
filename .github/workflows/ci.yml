name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

env:
  ORCHESTRATOR_SHARD_COUNT: 4
  SUITE_COMMAND: bun run check:suite --

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan secrets
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --exit-code 1 --verbose

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install
        run: bun install --silent
      - name: Static checks
        run: bun run check --omit=machine-only --omit=secrets

  orchestrator:
    name: orchestrator (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        run: bun install --silent
      - name: Test shard
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=orchestrator --shard=${{ matrix.shard }}/${ORCHESTRATOR_SHARD_COUNT}

  orchestrator-hooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: bun install --silent
      - name: Test
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=orchestrator/hooks

  orchestrator-hooks-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: bun install --silent
      - name: Test
        env:
          CI: "1"
        run: python3 -m unittest discover -s orchestrator/hooks -p 'process_*.py'

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        run: bun install --silent
      - name: Test
        env:
          CI: "1"
          BOTTEGA_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bun run --cwd orchestrator test:postgres --without-live-import

  cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        run: bun install --silent
      - name: Typecheck
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=cli

  hub:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        run: bun install --silent
      - name: Test
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=hub

  hub-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        run: bun install --silent
      - name: Test
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=hub/data

  hub-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        run: bun install --silent
      - name: Test and build
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=hub/web

  hub-web-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        run: bun install --silent
      - name: Install Chromium
        run: bun run --cwd hub/web playwright install --with-deps chromium
      - name: Build
        run: bun run --cwd hub/web build
      - name: Smoke
        run: bun run --cwd hub/web smoke

  hub-ui-stories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        run: bun install --silent
      - name: Install Chromium
        run: bun run --cwd hub/ui playwright install --with-deps chromium
      - name: Build stories
        run: bun run --cwd hub/ui storybook:build
      - name: Build view stories
        run: bun run --cwd hub/views storybook:build
      - name: Test stories
        run: bun run --cwd hub/ui storybook:test
      - name: Test view stories
        run: bun run --cwd hub/views storybook:test

  hub-deploy-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        run: bun install --silent
      - name: Test
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=hub/deploy/site

  retrieval:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        run: bun install --silent
      - name: Test
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=retrieval

  shared:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        run: bun install --silent
      - name: Test
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=shared

  root:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        run: bun install --silent
      - name: Test root batch
        env:
          CI: "1"
        run: $SUITE_COMMAND --only=root

  record-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          bun-version: 1.4.3
      - name: Require a rehearsal for record migration changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/check-record-rehearsal.ts
      - name: Pass outside the merge guard
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: "echo 'record rehearsal: no merge guard event'"

  ci:
    if: always()
    needs: [secrets, static, cli, orchestrator, orchestrator-hooks, orchestrator-hooks-process, postgres, hub, hub-data, hub-ui-stories, hub-web, hub-web-smoke, hub-deploy-site, retrieval, shared, root, record-rehearsal]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$RESULTS"
