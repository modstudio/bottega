# The remote gate. It runs the same `bun run check` the local gate runs, on
# every pull request and every push to main that touches code, so a green
# here is the same evidence as a green on the operator's machine. The local
# gate proves a commit; this run admits it.
name: ci

on:
  pull_request:
    paths: ['**.ts', '**.tsx', '**/package.json', 'bun.lock',
            '**/bunfig.toml', '**/tsconfig.json', 'scripts/**',
            'orchestrator/test/**', '.githooks/**', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['**.ts', '**.tsx', '**/package.json', 'bun.lock',
            '**/bunfig.toml', '**/tsconfig.json', 'scripts/**',
            'orchestrator/test/**', '.githooks/**', '.github/workflows/ci.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The timing ratchet and the canon checks read trunk history.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: |
          bun install --silent
          (cd orchestrator && bun install --silent)
          (cd hub && bun install --silent)
          (cd hub/web && bun install --silent)

      # One command, the same one the local gate runs: typechecks, every
      # suite, the web build, and the boundary, ceiling, timing, spawn,
      # fixture, brand and canon checks. CI=1 makes timing growth fatal here,
      # where it is informational locally.
      - name: Check
        env:
          CI: "1"
        run: bun run check
