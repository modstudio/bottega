name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --silent

      - name: Build release payload
        env:
          BOTTEGA_STATE_HOME: ${{ runner.temp }}/bottega-state
        run: bun run release:build -- "${GITHUB_REF_NAME}"

      - name: Publish private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BOTTEGA_STATE_HOME: ${{ runner.temp }}/bottega-state
        run: gh release create "${GITHUB_REF_NAME}" "$BOTTEGA_STATE_HOME/build/bottega-${GITHUB_REF_NAME#v}.tar.gz" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
