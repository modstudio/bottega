name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install
        run: bun install --frozen-lockfile

      - name: Validate release version
        run: bun run orch -- release check "${GITHUB_REF_NAME}"

      - name: Build installer artifacts
        run: bun run release:artifacts -- "${GITHUB_REF_NAME}" "${{ runner.temp }}/release-artifacts"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run release:publish -- "${GITHUB_REF_NAME}" "${{ runner.temp }}/release-artifacts" --confirm
