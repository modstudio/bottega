name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install

      - name: Allow unprivileged user namespaces for the sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run release smoke
        run: bun scripts/smoke-release.ts

  release:
    needs: release-smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Validate release version
        env:
          BOTTEGA_RELEASE_REQUIRE_PINNED_BUN: '1'
        run: bun run orch -- release check "${GITHUB_REF_NAME}"

      - name: Prove the release installs
        run: bun run release:install-proof -- "${GITHUB_REF_NAME}"

      - name: Build installer artifacts
        run: bun run release:artifacts -- "${GITHUB_REF_NAME}" "${{ runner.temp }}/release-artifacts"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run release:publish -- "${GITHUB_REF_NAME}" "${{ runner.temp }}/release-artifacts" --confirm
