[default]
locale = "en-us"

[default.extend-words]
# Adanim's registered task-key prefix is ADN.
adn = "adn"
# GAM is the registered task-key prefix used by gamma fixtures.
gam = "gam"
# `ands` names the indexes of `&&` operators in a parsed shell pipeline.
ands = "ands"
# `nd` is an ordinal suffix and the duration abbreviation for days.
nd = "nd"
# `unparseable` is the established adjective for input that cannot be parsed.
unparseable = "unparseable"
# Composer uses `analyse` as a conventional script name.
analyse = "analyse"

[default.extend-identifiers]
# `ba` is a regex fragment that includes both `bash` and `sh`.
ba = "ba"
# `DOUB` is a SQLite type-affinity prefix that matches DOUBLE.
DOUB = "DOUB"
# `requir` is a regex stem matching require, requires, and required.
requir = "requir"
# `uest` is the optional regex suffix that expands `req` to `request`.
uest = "uest"

[files]
extend-exclude = [
  # Installed dependencies are third-party code.
  "node_modules/**",
  # Bun's generated dependency lockfile is not hand-authored prose.
  "bun.lock",
  # Applied orchestrator migrations are checksummed history.
  "orchestrator/migrations/**",
  # Applied hub migrations are immutable database history.
  "hub/migrations/**",
  # Drizzle snapshot JSON is generated migration metadata.
  "shared/record/migrations/**",
  # Quality baseline JSON is generated by the repository's measurement scripts.
  "scripts/quality/*.json",
  # This folder holds deliberate misspellings that test the checker.
  "orchestrator/src/check/fixtures/spelling-samples/**",
  # CLAUDE.md files are symlinks to the AGENTS.md cards, which are checked directly.
  "**/CLAUDE.md",
]
